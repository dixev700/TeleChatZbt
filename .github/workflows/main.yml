name: Build TeleChat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract TeleChat
        run: |
          unzip -q huesos.zip -d app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Show Android project
        working-directory: app/TeleChat-CloudBuild/TeleChat-Android
        run: |
          echo "=== PROJECT ==="
          ls -lah

          echo "=== BUILD SCRIPT ==="
          sed -n '1,240p' build-android.sh

          echo "=== WEB ==="
          ls -lah web

      - name: Build Android
        working-directory: app/TeleChat-CloudBuild/TeleChat-Android
        run: |
          chmod +x build-android.sh
          ./build-android.sh

      - name: Find APK
        run: |
          echo "=== APK FILES ==="
          find app -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeleChat-APK
          path: app/**/*.apk
          if-no-files-found: error
