name: Build TeleChat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract TeleChat
        run: |
          unzip -q huesos.zip -d app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Fix web dependencies
        working-directory: app/TeleChat-CloudBuild/TeleChat-Android/web
        run: |
          npm install

      - name: Fix Gradle version
        working-directory: app/TeleChat-CloudBuild/TeleChat-Android
        run: |
          echo "=== Current Gradle configuration ==="
          cat android/gradle/wrapper/gradle-wrapper.properties

          echo "=== Switching Gradle to 9.5 ==="
          sed -i -E 's#gradle-[0-9.]+-(bin|all)\.zip#gradle-9.5-\1.zip#' android/gradle/wrapper/gradle-wrapper.properties

          echo "=== New Gradle configuration ==="
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Build Android
        working-directory: app/TeleChat-CloudBuild/TeleChat-Android
        run: |
          chmod +x build-android.sh
          ./build-android.sh

      - name: Find APK
        run: |
          echo "=== APK FILES ==="
          find app -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeleChat-APK
          path: app/**/*.apk
          if-no-files-found: error
