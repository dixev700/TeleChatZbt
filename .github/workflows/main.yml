name: Build TeleChat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract TeleChat
        run: |
          unzip -q huesos.zip -d app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5'

      - name: Install web dependencies
        working-directory: app/TeleChat-CloudBuild/TeleChat-Android/web
        run: |
          npm install

      - name: Prepare Android build
        working-directory: app/TeleChat-CloudBuild/TeleChat-Android
        run: |
          chmod +x build-android.sh

          echo "=== Build script before patch ==="
          cat build-android.sh

          sed -i 's#\./gradlew#gradle#g' build-android.sh
          sed -i 's#gradlew#gradle#g' build-android.sh

          echo "=== Build script after patch ==="
          cat build-android.sh

      - name: Build Android
        working-directory: app/TeleChat-CloudBuild/TeleChat-Android
        run: |
          ./build-android.sh

      - name: Find APK
        run: |
          echo "=== APK FILES ==="
          find app -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeleChat-APK
          path: app/**/*.apk
          if-no-files-found: error
